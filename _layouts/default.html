<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 120 }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">E</span>
        <span class="brand-text">ENIGMA <span class="brand-sub">DEV LOG</span></span>
      </a>
      <nav class="nav">
        <a href="{{ '/' | relative_url }}">記事一覧</a>
        <a href="https://n4t.atlassian.net/wiki/spaces/Enigma" target="_blank" rel="noopener">設計書 (Confluence)</a>
        <a href="https://github.com/L6K/tpgmoba" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
    <div class="gold-line"></div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="gold-line"></div>
    <div class="container footer-inner">
      <p>Enigma — Fantasy×SF 3v3 MOBA (Unity 6 / URP)</p>
      <p class="credit">キャラクターモデル: © Unity Technologies Japan/UCL ・ マップ素材: Kenney (CC0) ・ アイコン: Kenney Game Icons (CC0)</p>
    </div>
  </footer>
</body>
</html>
