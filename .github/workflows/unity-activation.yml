name: Unity License Activation

# このワークフローは初回一回だけ手動で実行してください
# 実行後にアーティファクト (Unity_v6000.x.ulf) をダウンロードし、
# GitHub Secrets に UNITY_LICENSE として登録します

on:
  workflow_dispatch: {}

jobs:
  activation:
    name: Request Unity License
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v${{ steps.getManualLicenseFile.outputs.unityVersion }}
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
