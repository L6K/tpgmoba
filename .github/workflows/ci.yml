name: CI

on:
  pull_request:
    branches: [main]
  # PRのコミット追加時も再実行
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true  # 同じブランチの古いCIをキャンセル

jobs:
  # ────────────────────────────────────────────────
  # 1. コンパイルチェック（EditMode）
  # ────────────────────────────────────────────────
  compile:
    name: Compile Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - name: Run EditMode Tests (= compile check)
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.16f1
          testMode: editmode
          coverageOptions: ''

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/editmode-results.xml

  # ────────────────────────────────────────────────
  # 2. ビルドチェック（Windows64）
  # ────────────────────────────────────────────────
  build:
    name: Build Check (Windows64)
    runs-on: ubuntu-latest
    needs: compile   # コンパイルが通ってからビルド
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.16f1
          targetPlatform: StandaloneWindows64
          buildsPath: build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-Windows64
          path: build/StandaloneWindows64
          retention-days: 3   # 3日で自動削除（容量節約）
