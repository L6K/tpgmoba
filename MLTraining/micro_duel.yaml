# B1 v2: ranged PPO learner vs scripted melee chaser (asymmetric duel).
# v1 (symmetric self-play) collapsed into stand-and-trade because movement had
# no causal effect with undodgeable auto-attacks; kiting vs a faster melee
# chaser gives movement a clear learnable payoff.
# Run: mlagents-learn MLTraining/micro_duel.yaml --run-id=micro_duel_v2 --force
#      then press Play on Arena.unity in the Unity editor.
# Contract: 11 obs / 2 continuous actions / BehaviorName=MicroDuel (Confluence 05 B1)
behaviors:
  MicroDuel:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 1500000
    time_horizon: 128
    summary_freq: 20000
