# B4: BC warm-start - imitate the scripted AI (CombatMicroModel) from demos, then fine-tune with PPO.
# External-review watch items: overfitting to the demo (gail vs extrinsic divergence)
# and regression at the BC->RL handoff.
# Steps:
#   1. Put Temp/demo_record_request.json and play Arena.unity to record scripted-AI play.
#      (Actual output is Assets/ML-Agents/Demos/microduelscripte.demo due to SanitizeName;
#       10+ minutes = hundreds of episodes.)
#   2. mlagents-learn MLTraining/micro_duel_bc.yaml --run-id=micro_duel_bc_v1 --force
#      then play Arena.unity (BehaviorType must be back to Default = trigger file deleted).
#   3. Evaluate with the B3 protocol (scripted AI and ONNX measured separately vs the
#      common chaser, 100 episodes each, report 95% CI).
# Contract: 11 obs / 2 continuous actions / BehaviorName=MicroDuel (Confluence 05 B1, v5 rewards)
behaviors:
  MicroDuel:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      # GAIL: rewards distribution-match with the demo (kept weak to avoid overfitting;
      # extrinsic takes over as it grows).
      gail:
        gamma: 0.99
        strength: 0.3
        demo_path: Assets/ML-Agents/Demos/microduelscripte.demo
    # BC: pulls the early policy directly toward the demo. Linearly decayed over 500k
    # steps to avoid both catastrophic forgetting and the imitation ceiling
    # (the scripted AI's 44% would otherwise cap us).
    behavioral_cloning:
      demo_path: Assets/ML-Agents/Demos/microduelscripte.demo
      strength: 0.5
      steps: 500000
    max_steps: 1500000
    time_horizon: 128
    summary_freq: 20000
